[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-card"
version = "0.1.0"
description = "Turn a set of 3D-printable parts into one printable card: parts gated to a frame like a model-kit sprue, with a check that every part comes off clean. Includes print-in-place joints and printability checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Konstantinos Georgiou" }]
dependencies = [
  "3d-base>=0.1.0",
  "numpy>=1.24",
  "trimesh>=4.0",
  "manifold3d>=2.4",
  "scipy>=1.10",
  "shapely>=2.0",
  "matplotlib>=3.7",
  "build123d>=0.8",
  "rtree>=1.0",
  "networkx>=3.0",
]
keywords = ["3d-printing", "sprue", "kit card", "model kit", "joints", "print-in-place", "trimesh", "build123d"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics :: 3D Modeling"]

[project.urls]
Homepage = "https://github.com/drkostas/3d-card"

[project.optional-dependencies]
sim = ["mujoco>=3.0", "coacd>=1.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
